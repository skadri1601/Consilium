[tool.poetry]
name = "consilium-agents"
version = "0.1.0"
description = "AI Council Platform - Multi-agent LLM orchestration workers"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# LLM Providers
openai = "^1.50.0"
anthropic = "^0.40.0"
google-generativeai = "^0.8.0"
google-api-core = "^2.24.0"

# API Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"

# Async & HTTP
httpx = "^0.28.0"
aiohttp = "^3.11.0"

# Database & Cache
redis = "^5.2.0"
asyncpg = "^0.30.0"

# Utilities
python-dotenv = "^1.0.0"
python-multipart = "^0.0.18"
structlog = "^24.4.0"

# Observability
langfuse = "^2.56.0"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.50.0"}
posthog = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.0"
pre-commit = "^4.0.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyrefly]
search-path = ["."]
disable-search-path-heuristics = true
ignore-missing-imports = [
  "google.generativeai",
]
[tool.pyrefly.errors]
deprecated = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
