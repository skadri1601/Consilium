[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consilium"
version = "0.1.0"
description = "Python SDK for the Consilium multi-AI deliberation platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Consilium Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]
keywords = ["ai", "deliberation", "multi-agent", "llm", "debate"]

[project.urls]
Homepage = "https://github.com/anthropics/consilium"
Documentation = "https://github.com/anthropics/consilium#readme"
Repository = "https://github.com/anthropics/consilium"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
    "respx>=0.20",
]

[tool.setuptools.packages.find]
include = ["consilium*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
