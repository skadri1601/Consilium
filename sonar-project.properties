# Copy-paste (CPD) duplication exclusions.
#
# SonarCloud's clone detector counts repeated object literals as
# "duplicate code" even when the file is genuinely a data registry
# (one row per model, one row per agent, one row per fixture). The
# files below are intentionally data-shaped and not behaviour:
#
#   - constants.ts / models.ts / provider.ts: provider + model
#     catalogs that mirror the canonical Python catalog. Each entry
#     repeats the same {id, name, provider, ...} keys by design.
#   - pricing/page.tsx, docs/providers/page.tsx, docs/api/page.tsx:
#     marketing tables rendered from those catalogs.
#   - blog-data.ts: blog post metadata array.
#   - e2e fixtures: JSON-shaped mock event arrays.
#
# Behaviour code (api-keys.service.ts, the agent base class, the blog
# post body components, the api keys settings UI) is intentionally
# not on this list — Sonar should still detect duplication there.
sonar.cpd.exclusions=\
  apps/web/src/shared/lib/constants.ts,\
  apps/web/src/marketing-models.ts,\
  apps/web/src/app/(marketing)/pricing/page.tsx,\
  apps/web/src/app/(marketing)/docs/providers/page.tsx,\
  apps/web/src/app/(marketing)/docs/api/page.tsx,\
  apps/web/src/app/(marketing)/blog/blog-data.ts,\
  apps/web/e2e/full-platform.spec.ts,\
  apps/web/e2e/stress-scenarios.spec.ts,\
  packages/shared/src/providers/models.ts,\
  packages/shared/src/providers/provider.ts,\
  apps/agents/src/shared/config/models.py,\
  packages/cli/src/utils/default-models.ts
