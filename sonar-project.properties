sonar.projectKey=consilium
sonar.organization=consilium-pi
sonar.sources=apps/web/src,apps/api/src,apps/agents
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/__pycache__/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/prisma/migrations/**
sonar.tests=apps/web/src,apps/api/src
