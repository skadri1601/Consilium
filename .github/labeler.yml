"app:web":
  - changed-files:
      - any-glob-to-any-file: "apps/web/**"

"app:api":
  - changed-files:
      - any-glob-to-any-file: "apps/api/**"

"app:agents":
  - changed-files:
      - any-glob-to-any-file: "apps/agents/**"

"pkg:database":
  - changed-files:
      - any-glob-to-any-file: "packages/database/**"

"pkg:ui":
  - changed-files:
      - any-glob-to-any-file: "packages/ui/**"

"pkg:cli":
  - changed-files:
      - any-glob-to-any-file: "packages/cli/**"

"pkg:config":
  - changed-files:
      - any-glob-to-any-file: "packages/config/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Dockerfile"
          - "docker-compose.yml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"
          - "**/package.json"
          - "apps/agents/pyproject.toml"
          - "apps/agents/uv.lock"

documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
