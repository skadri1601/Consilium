name: 'Consilium Multi-Model PR Review'
description: 'Run multi-model deliberation on pull request changes'
inputs:
  api_url:
    description: 'Consilium API URL'
    required: false
    default: 'http://localhost:4000/api/v1'
  mode:
    description: 'Deliberation mode (red-team, council, blind-eval)'
    required: false
    default: 'red-team'
  models:
    description: 'Comma-separated model IDs'
    required: false
  github_token:
    description: 'GitHub token for posting review comments'
    required: true
  anthropic_api_key:
    description: 'Anthropic API key'
    required: false
  openai_api_key:
    description: 'OpenAI API key'
    required: false
  max_rounds:
    description: 'Maximum deliberation rounds'
    required: false
    default: '3'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: pip install httpx

    - name: Get PR diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr_diff.txt

    - name: Run Consilium deliberation
      shell: bash
      env:
        CONSILIUM_API_URL: ${{ inputs.api_url }}
        CONSILIUM_MODE: ${{ inputs.mode }}
        CONSILIUM_MODELS: ${{ inputs.models }}
        CONSILIUM_MAX_ROUNDS: ${{ inputs.max_rounds }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python ${{ github.action_path }}/review.py
