name: Deploy Droplet

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/agents/**"
      - "packages/database/**"
      - "packages/shared/**"
      - "docker-compose.droplet.yml"
      - "Caddyfile"

  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /opt/consilium

            git remote set-url origin "https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/skadri1601/Consilium.git"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Building services ==="
            docker compose -f docker-compose.droplet.yml build --no-cache

            echo "=== Syncing database schema (prisma db push) ==="
            docker compose -f docker-compose.droplet.yml run --rm -T --no-deps --entrypoint sh api \
              -c 'cd /app/packages/database && npx prisma db push'

            echo "=== Starting services ==="
            docker compose -f docker-compose.droplet.yml up -d

            echo "=== Waiting for health checks ==="
            sleep 15
            docker compose -f docker-compose.droplet.yml ps
            echo ""
            echo "Deployed commit: $(git log --oneline -1)"
