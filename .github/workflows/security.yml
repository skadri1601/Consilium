name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python Security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: latest

      - name: Run pip-audit
        run: |
          pip install pip-audit
          cd apps/agents && poetry export -f requirements.txt --without-hashes -o /tmp/requirements.txt && pip-audit -r /tmp/requirements.txt
        continue-on-error: true

      - name: Run bandit
        id: bandit
        run: |
          pip install bandit
          bandit -r apps/agents/src -f json -o bandit-report.json || true
          FINDINGS=$(python -c "import json,sys; d=json.load(open('bandit-report.json')); print(len(d.get('results',[])))" 2>/dev/null || echo 0)
          echo "findings=${FINDINGS}" >> "$GITHUB_OUTPUT"
          echo "Bandit findings: ${FINDINGS}"

      - name: Upload bandit report
        if: steps.bandit.outputs.findings != '0'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 1
          if-no-files-found: ignore

  codeql:
    name: CodeQL Analysis
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
