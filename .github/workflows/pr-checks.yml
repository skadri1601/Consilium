name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            web
            api
            agents
            cli
            ui
            database
            config
            deps
          requireScope: false

  pr-size:
    name: Label PR by Size
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: CodelyTV/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: size/xs
          xs_max_size: 10
          s_label: size/s
          s_max_size: 100
          m_label: size/m
          m_max_size: 500
          l_label: size/l
          l_max_size: 1000
          xl_label: size/xl
          fail_if_xl: false
          files_to_ignore: pnpm-lock.yaml

  labeler:
    name: Auto-label Changed Files
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  branch-freshness:
    name: Branch Freshness
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare branch against base
        id: freshness
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STALE_COMMITS: "50"
          STALE_DAYS: "14"
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin "$BASE_REF" || git fetch --no-tags origin "$BASE_REF"
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          BEHIND=$(git rev-list --count "$MERGE_BASE..$BASE_SHA")
          AHEAD=$(git rev-list --count "$MERGE_BASE..$HEAD_SHA")
          BASE_DATE=$(git log -1 --format=%ct "$BASE_SHA")
          MB_DATE=$(git log -1 --format=%ct "$MERGE_BASE")
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - MB_DATE) / 86400 ))
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD"   >> "$GITHUB_OUTPUT"
          echo "age_days=$AGE_DAYS" >> "$GITHUB_OUTPUT"
          {
            echo "## Branch Freshness"
            echo ""
            echo "- Base: \`$BASE_REF\` ($BASE_SHA)"
            echo "- Merge base age: $AGE_DAYS days"
            echo "- Commits behind base: $BEHIND"
            echo "- Commits ahead of base: $AHEAD"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BEHIND" -gt "$STALE_COMMITS" ] || [ "$AGE_DAYS" -gt "$STALE_DAYS" ]; then
            echo "::warning::Branch is stale: $BEHIND commits behind, merge-base age ${AGE_DAYS}d (thresholds: $STALE_COMMITS commits / ${STALE_DAYS}d). Rebase or merge $BASE_REF before relying on CI results."
          fi
