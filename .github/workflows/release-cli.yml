name: Release CLI binaries

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. cli-v0.5.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

env:
  CLI_REPO_OWNER: skadri1601
  CLI_REPO_NAME: Consilium
  HOMEBREW_TAP_REPO: skadri1601/homebrew-tap

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#cli-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building CLI ${VERSION} (tag ${TAG})"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build standalone binaries
        run: bash packages/cli/scripts/build-binaries.sh

      - name: Compute checksums
        working-directory: packages/cli/dist-binaries
        run: |
          shasum -a 256 consilium-* | tee SHA256SUMS
          # Also emit per-file .sha256 sidecars for easy consumption by the brew tap job.
          for f in consilium-*; do
            shasum -a 256 "$f" | awk '{print $1}' > "${f}.sha256"
          done
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: packages/cli/dist-binaries/
          if-no-files-found: error
          retention-days: 7

  attach-to-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist-binaries

      - name: List artifacts
        run: ls -lh dist-binaries/

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-binaries.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist-binaries/consilium-linux-x64
            dist-binaries/consilium-linux-arm64
            dist-binaries/consilium-darwin-x64
            dist-binaries/consilium-darwin-arm64
            dist-binaries/consilium-windows-x64.exe
            dist-binaries/SHA256SUMS

  update-homebrew-tap:
    needs: build-binaries
    runs-on: ubuntu-latest
    # Skipped if HOMEBREW_TAP_TOKEN isn't configured yet. Lets the workflow stay
    # green on first runs before the tap repo is set up.
    if: ${{ needs.build-binaries.result == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist-binaries

      - name: Check for tap token
        id: token-check
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set - skipping tap update. See .github/workflows/release-cli.yml for setup."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render formula
        if: steps.token-check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-binaries.outputs.version }}"
          DARWIN_ARM64_SHA=$(cat dist-binaries/consilium-darwin-arm64.sha256)
          DARWIN_X64_SHA=$(cat dist-binaries/consilium-darwin-x64.sha256)
          LINUX_ARM64_SHA=$(cat dist-binaries/consilium-linux-arm64.sha256)
          LINUX_X64_SHA=$(cat dist-binaries/consilium-linux-x64.sha256)

          mkdir -p rendered
          sed \
            -e "s/^  version \".*\"$/  version \"${VERSION}\"/" \
            -e "s/REPLACE_WITH_DARWIN_ARM64_SHA256/${DARWIN_ARM64_SHA}/" \
            -e "s/REPLACE_WITH_DARWIN_X64_SHA256/${DARWIN_X64_SHA}/" \
            -e "s/REPLACE_WITH_LINUX_ARM64_SHA256/${LINUX_ARM64_SHA}/" \
            -e "s/REPLACE_WITH_LINUX_X64_SHA256/${LINUX_X64_SHA}/" \
            Formula/consilium.rb > rendered/consilium.rb

          echo "--- Rendered formula ---"
          cat rendered/consilium.rb

      - name: Push to homebrew-tap
        if: steps.token-check.outputs.skip == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build-binaries.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp rendered/consilium.rb tap/Formula/consilium.rb

          cd tap
          git config user.name "consilium-release-bot"
          git config user.email "bot@myconsilium.xyz"

          if git diff --quiet -- Formula/consilium.rb; then
            echo "No formula changes - tap already at ${VERSION}."
            exit 0
          fi

          git add Formula/consilium.rb
          git commit -m "consilium ${VERSION}"
          git push origin HEAD
