name: "Frogbot Scan Pull Request"
on:
  pull_request:
    types: [ opened, synchronize ]
permissions:
  contents: read
jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Skip - JFrog not configured
        run: |
          echo "::notice::JFrog (JF_URL) not configured in repository secrets. Skipping Frogbot scan."
          echo "This workflow is a no-op until JFrog Xray credentials are added."
          exit 0
