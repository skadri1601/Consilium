name: Mirror public repos

on:
  push:
    branches:
      - main
    paths:
      - 'packages/cli/**'
      - 'packages/sdk/**'
      - 'packages/python-sdk/**'
      - 'apps/vscode-extension/**'
      - 'packages/shared/src/debates/**'
      - 'scripts/mirror-public-repos.sh'
      - 'scripts/mirror/**'
      - '.github/workflows/mirror-public-repos.yml'
  workflow_dispatch:

concurrency:
  group: mirror-public-repos
  cancel-in-progress: false

jobs:
  mirror:
    name: Sync to public repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Run mirror
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: bash scripts/mirror-public-repos.sh
