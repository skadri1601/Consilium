name: Linear Sync

on:
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Extract ticket ID
        id: ticket
        run: |
          BRANCH="${{ github.head_ref }}"
          TITLE="${{ github.event.pull_request.title }}"
          TICKET=$(echo "$BRANCH $TITLE" | grep -oP 'MYC-\d+' | head -1)
          echo "id=$TICKET" >> $GITHUB_OUTPUT

      - name: Update Linear and notify Slack
        if: steps.ticket.outputs.id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET_ID: ${{ steps.ticket.outputs.id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "$PR_ACTION" = "opened" ] || [ "$PR_ACTION" = "ready_for_review" ] || [ "$PR_ACTION" = "reopened" ]; then
            STATE_NAME="In Review"
            MSG=":github: PR #${PR_NUMBER} opened for ${TICKET_ID}: ${PR_TITLE} - <${PR_URL}|View PR>"
          elif [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
            STATE_NAME="Done"
            MSG=":white_check_mark: PR #${PR_NUMBER} merged for ${TICKET_ID}: ${PR_TITLE} - ticket marked Done"
          elif [ "$PR_ACTION" = "closed" ]; then
            STATE_NAME="In Progress"
            MSG=":x: PR #${PR_NUMBER} closed (not merged) for ${TICKET_ID} - ticket back to In Progress"
          elif [ "$PR_ACTION" = "converted_to_draft" ]; then
            STATE_NAME="In Progress"
            MSG=""
          else
            exit 0
          fi

          ISSUE_DATA=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { issueSearch(filter: { number: { eq: ${TICKET_ID#MYC-} } }) { nodes { id team { id } } } }\"}")

          ISSUE_ID=$(echo "$ISSUE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['issueSearch']['nodes'][0]['id'])" 2>/dev/null)
          TEAM_ID=$(echo "$ISSUE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['issueSearch']['nodes'][0]['team']['id'])" 2>/dev/null)

          if [ -z "$ISSUE_ID" ]; then
            echo "Could not find Linear issue for $TICKET_ID"
            exit 0
          fi

          STATE_ID=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { workflowStates(filter: { team: { id: { eq: \\\"$TEAM_ID\\\" } }, name: { eq: \\\"$STATE_NAME\\\" } }) { nodes { id } } }\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['workflowStates']['nodes'][0]['id'])" 2>/dev/null)

          if [ -n "$STATE_ID" ]; then
            curl -s -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"mutation { issueUpdate(id: \\\"$ISSUE_ID\\\", input: { stateId: \\\"$STATE_ID\\\" }) { success } }\"}"
          fi

          curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { commentCreate(input: { issueId: \\\"$ISSUE_ID\\\", body: \\\"PR ${PR_ACTION}: [${PR_TITLE}](${PR_URL})\\\" }) { success } }\"}"

          if [ -n "$MSG" ] && [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"$MSG\"}"
          fi

  notify-review:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack of review
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          REVIEWER="${{ github.event.review.user.login }}"
          STATE="${{ github.event.review.state }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          BODY=$(echo "${{ github.event.review.body }}" | head -c 300)

          if [ "$STATE" = "approved" ]; then
            ICON=":white_check_mark:"
          elif [ "$STATE" = "changes_requested" ]; then
            ICON=":x:"
          else
            ICON=":speech_balloon:"
          fi

          MSG="${ICON} PR #${PR_NUM} review by ${REVIEWER}: ${STATE}\n${PR_TITLE}\n${BODY}\n<${PR_URL}|View>"

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"$MSG\"}"
          fi

  notify-ci:
    if: github.event_name == 'check_suite' && github.event.check_suite.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify CI failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          CONCLUSION="${{ github.event.check_suite.conclusion }}"
          BRANCH="${{ github.event.check_suite.head_branch }}"
          URL="${{ github.event.check_suite.url }}"

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \":x: CI/CD pipeline ${CONCLUSION} on branch ${BRANCH}\"}"
          fi
