name: Linear Sync

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  issue_comment:
    types: [created]

env:
  TICKET_PREFIX: MYC

jobs:
  # Single source of truth for "issue opened on GitHub". Searches
  # Linear by title; if it finds an exact match, links the GitHub
  # issue to that ticket. If not, creates a new ticket. Replaces the
  # old `issue-to-linear` + `github-issue-sync` pair, which both
  # fired on the same event and caused two Linear tickets to be
  # created for every new GitHub issue.
  issue-to-linear:
    name: Sync GitHub Issue → Linear
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Search Linear for existing ticket by title
        id: search
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          RESPONSE=$(curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$ISSUE_TITLE" \
              '{query: "query($q: String!) { issueSearch(query: $q, first: 5) { nodes { id identifier number title url team { id key } } } }", variables: {q: $q}}')")

          ISSUE_ID=$(echo "$RESPONSE" | jq -r --arg t "$ISSUE_TITLE" \
            '.data.issueSearch.nodes[] | select(.title == $t) | .id' | head -1)
          IDENTIFIER=$(echo "$RESPONSE" | jq -r --arg t "$ISSUE_TITLE" \
            '.data.issueSearch.nodes[] | select(.title == $t) | .identifier' | head -1)
          ISSUE_URL=$(echo "$RESPONSE" | jq -r --arg t "$ISSUE_TITLE" \
            '.data.issueSearch.nodes[] | select(.title == $t) | .url' | head -1)

          {
            echo "issue_id=$ISSUE_ID"
            echo "identifier=$IDENTIFIER"
            echo "url=$ISSUE_URL"
            echo "found=$([ -n "$ISSUE_ID" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Look up default team ID for new ticket
        id: team
        if: steps.search.outputs.found == 'false'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        run: |
          if [ -n "$LINEAR_TEAM_ID" ]; then
            echo "id=$LINEAR_TEAM_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESPONSE=$(curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query": "query { teams { nodes { id key } } }"}')
          TEAM_ID=$(echo "$RESPONSE" | jq -r \
            --arg key "$TICKET_PREFIX" '.data.teams.nodes[] | select(.key == $key) | .id')
          echo "id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Create Linear ticket
        id: create
        if: steps.search.outputs.found == 'false' && steps.team.outputs.id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TEAM_ID: ${{ steps.team.outputs.id }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_ISSUE_URL: ${{ github.event.issue.html_url }}
          GH_ISSUE_NUM: ${{ github.event.issue.number }}
          GH_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          DESCRIPTION=$(printf '**GitHub Issue #%s** by @%s: %s\n\n%s' \
            "$GH_ISSUE_NUM" "$GH_ISSUE_AUTHOR" "$GH_ISSUE_URL" "$ISSUE_BODY")

          RESPONSE=$(curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg teamId "$TEAM_ID" \
              --arg title "$ISSUE_TITLE" \
              --arg desc "$DESCRIPTION" \
              '{query: "mutation($teamId: String!, $title: String!, $desc: String!) { issueCreate(input: { teamId: $teamId, title: $title, description: $desc }) { issue { id identifier url } } }", variables: {teamId: $teamId, title: $title, desc: $desc}}')")

          {
            echo "issue_id=$(echo "$RESPONSE" | jq -r '.data.issueCreate.issue.id // empty')"
            echo "identifier=$(echo "$RESPONSE" | jq -r '.data.issueCreate.issue.identifier // empty')"
            echo "url=$(echo "$RESPONSE" | jq -r '.data.issueCreate.issue.url // empty')"
          } >> "$GITHUB_OUTPUT"

      - name: Attach GitHub issue link
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_ID: ${{ steps.search.outputs.issue_id || steps.create.outputs.issue_id }}
          GH_ISSUE_URL: ${{ github.event.issue.html_url }}
          GH_ISSUE_NUM: ${{ github.event.issue.number }}
        if: ${{ steps.search.outputs.issue_id != '' || steps.create.outputs.issue_id != '' }}
        run: |
          curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg id "$ISSUE_ID" \
              --arg url "$GH_ISSUE_URL" \
              --arg title "GitHub Issue #$GH_ISSUE_NUM" \
              '{query: "mutation($id: String!, $url: String!, $title: String!) { attachmentCreate(input: { issueId: $id, url: $url, title: $title }) { success } }", variables: {id: $id, url: $url, title: $title}}')"

      - name: Comment link on existing Linear ticket
        if: steps.search.outputs.found == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_ID: ${{ steps.search.outputs.issue_id }}
          GH_ISSUE_URL: ${{ github.event.issue.html_url }}
          GH_ISSUE_NUM: ${{ github.event.issue.number }}
          GH_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg id "$ISSUE_ID" \
              --arg body "Linked to GitHub issue #$GH_ISSUE_NUM opened by $GH_ISSUE_AUTHOR: $GH_ISSUE_URL" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')"

      - name: Comment ticket ID on GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IDENTIFIER: ${{ steps.search.outputs.identifier || steps.create.outputs.identifier }}
          LINEAR_URL: ${{ steps.search.outputs.url || steps.create.outputs.url }}
          REPO: ${{ github.repository }}
          FOUND: ${{ steps.search.outputs.found }}
        if: ${{ steps.search.outputs.identifier != '' || steps.create.outputs.identifier != '' }}
        run: |
          if [ "$FOUND" = "true" ]; then
            BODY="Linked to existing Linear ticket: [${IDENTIFIER}](${LINEAR_URL})"
          else
            BODY="Linear ticket created: [${IDENTIFIER}](${LINEAR_URL})"
          fi
          curl -sf -X POST "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$BODY" '{body: $body}')"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FOUND: ${{ steps.search.outputs.found }}
          EXISTING_ID: ${{ steps.search.outputs.identifier }}
          NEW_ID: ${{ steps.create.outputs.identifier }}
          GH_ISSUE_URL: ${{ github.event.issue.html_url }}
          GH_ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$FOUND" = "true" ]; then
            MSG=":link: GitHub issue #${GH_ISSUE_NUM} linked to existing ${EXISTING_ID}: _${ISSUE_TITLE}_ — <${GH_ISSUE_URL}|View>"
          elif [ -n "$NEW_ID" ]; then
            MSG=":new: GitHub issue #${GH_ISSUE_NUM} → created ${NEW_ID}: _${ISSUE_TITLE}_ — <${GH_ISSUE_URL}|View>"
          else
            MSG=":warning: GitHub issue #${GH_ISSUE_NUM} opened but Linear sync failed: _${ISSUE_TITLE}_"
          fi
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$MSG" '{text: $text}')"
          fi

  pr-lifecycle:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Extract primary ticket ID
        id: ticket
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Case-insensitive match across branch, title, AND body. The
          # first hit becomes the "primary" ticket; additional ids are
          # discovered separately for issue relations.
          TICKET=$(printf '%s\n%s\n%s' "$BRANCH" "$TITLE" "$BODY" \
            | grep -oiP "${TICKET_PREFIX}-\d+" \
            | head -1 \
            | tr '[:lower:]' '[:upper:]')
          echo "id=$TICKET" >> "$GITHUB_OUTPUT"

      - name: Determine state and message
        id: resolve
        if: steps.ticket.outputs.id != ''
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          TICKET_ID: ${{ steps.ticket.outputs.id }}
        run: |
          # Comma-separated state name fallbacks survive a workspace
          # renaming "In Review" to "Ready for Review", "Done" to
          # "Completed", etc. The Linear lookup uses GraphQL `in:`.
          if [ "$PR_ACTION" = "opened" ] || [ "$PR_ACTION" = "ready_for_review" ] || [ "$PR_ACTION" = "reopened" ]; then
            echo 'state_names=["In Review","Ready for Review","Code Review","Review"]' >> "$GITHUB_OUTPUT"
            echo "slack_msg=:github: PR #${PR_NUMBER} opened for ${TICKET_ID} by ${PR_AUTHOR} - <${PR_URL}|View PR>" >> "$GITHUB_OUTPUT"
            echo "linear_comment=PR #${PR_NUMBER} opened by ${PR_AUTHOR}: ${PR_URL}" >> "$GITHUB_OUTPUT"
          elif [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
            echo 'state_names=["Done","Completed","Closed","Merged","Shipped"]' >> "$GITHUB_OUTPUT"
            echo "slack_msg=:white_check_mark: PR #${PR_NUMBER} merged for ${TICKET_ID} - ticket marked Done" >> "$GITHUB_OUTPUT"
            echo "linear_comment=PR #${PR_NUMBER} merged" >> "$GITHUB_OUTPUT"
          elif [ "$PR_ACTION" = "closed" ]; then
            echo 'state_names=["In Progress","Started","Doing","Active"]' >> "$GITHUB_OUTPUT"
            echo "slack_msg=:x: PR #${PR_NUMBER} closed for ${TICKET_ID} - back to In Progress" >> "$GITHUB_OUTPUT"
            echo "linear_comment=PR #${PR_NUMBER} closed without merge" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up Linear issue
        id: linear
        if: steps.resolve.outputs.state_names != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET_ID: ${{ steps.ticket.outputs.id }}
        run: |
          TICKET_NUM="${TICKET_ID#*-}"
          RESPONSE=$(curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "query { issueSearch(filter: { number: { eq: $TICKET_NUM } }) { nodes { id team { id } } } }" '{query: $q}')")

          {
            echo "issue_id=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].id // empty')"
            echo "team_id=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].team.id // empty')"
          } >> "$GITHUB_OUTPUT"

      - name: Update Linear state
        if: steps.linear.outputs.issue_id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_ID: ${{ steps.linear.outputs.issue_id }}
          TEAM_ID: ${{ steps.linear.outputs.team_id }}
          STATE_NAMES: ${{ steps.resolve.outputs.state_names }}
        run: |
          STATE_ID=$(curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg teamId "$TEAM_ID" \
              --argjson names "$STATE_NAMES" \
              '{query: "query($teamId: ID!, $names: [String!]!) { workflowStates(filter: { team: { id: { eq: $teamId } }, name: { in: $names } }) { nodes { id name } } }", variables: {teamId: $teamId, names: $names}}')" \
            | jq -r '.data.workflowStates.nodes[0].id // empty')

          if [ -n "$STATE_ID" ]; then
            curl -sf -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg id "$ISSUE_ID" \
                --arg sid "$STATE_ID" \
                '{query: "mutation($id: String!, $sid: String!) { issueUpdate(id: $id, input: { stateId: $sid }) { success } }", variables: {id: $id, sid: $sid}}')"
          else
            echo "::warning::No matching workflow state found in $STATE_NAMES on team $TEAM_ID"
          fi

      - name: Add Linear comment
        if: steps.linear.outputs.issue_id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_ID: ${{ steps.linear.outputs.issue_id }}
          COMMENT_BODY: ${{ steps.resolve.outputs.linear_comment }}
        run: |
          curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg id "$ISSUE_ID" \
              --arg body "$COMMENT_BODY" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')"

      - name: Parse PR body for Closes/Fixes refs
        id: refs
        if: steps.linear.outputs.issue_id != '' && github.event.action == 'opened'
        env:
          BODY: ${{ github.event.pull_request.body }}
          PRIMARY: ${{ steps.ticket.outputs.id }}
        run: |
          # Match GitHub-standard closing keywords + MYC-NN.
          # `close`, `closes`, `closed`, `fix`, `fixes`, `fixed`,
          # `resolve`, `resolves`, `resolved`, plus our own `refs`/`see`.
          IDS=$(printf '%s' "$BODY" \
            | grep -oiP '(close[sd]?|fix(es|ed)?|resolve[sd]?|refs?|see)\s*:?\s*'"${TICKET_PREFIX}"'-\d+' \
            | grep -oiP "${TICKET_PREFIX}-\d+" \
            | tr '[:lower:]' '[:upper:]' \
            | grep -v "^${PRIMARY}$" \
            | sort -u || true)
          # `jq -R . | jq -s .` turns newline-separated input into a JSON array.
          IDS_JSON=$(printf '%s' "$IDS" | jq -R . | jq -s 'map(select(length > 0))')
          {
            echo "ids_json<<EOF"
            echo "$IDS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Linear issue relations
        if: steps.refs.outputs.ids_json != '' && steps.refs.outputs.ids_json != '[]'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PRIMARY_ID: ${{ steps.linear.outputs.issue_id }}
          IDS_JSON: ${{ steps.refs.outputs.ids_json }}
        run: |
          echo "$IDS_JSON" | jq -r '.[]' | while read -r REF; do
            REF_NUM="${REF#*-}"
            REF_ID=$(curl -sf -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "query { issueSearch(filter: { number: { eq: $REF_NUM } }) { nodes { id } } }" '{query: $q}')" \
              | jq -r '.data.issueSearch.nodes[0].id // empty')

            if [ -z "$REF_ID" ]; then
              echo "::warning::Linear issue $REF referenced in PR body not found"
              continue
            fi

            curl -sf -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg issueId "$PRIMARY_ID" \
                --arg relatedId "$REF_ID" \
                '{query: "mutation($issueId: String!, $relatedId: String!) { issueRelationCreate(input: { issueId: $issueId, relatedIssueId: $relatedId, type: related }) { success } }", variables: {issueId: $issueId, relatedId: $relatedId}}')"
            echo "Linked $REF as related"
          done

      - name: Notify Slack
        if: steps.resolve.outputs.slack_msg != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MSG: ${{ steps.resolve.outputs.slack_msg }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$SLACK_MSG" '{text: $text}')"
          fi

  pr-review:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Extract ticket ID
        id: ticket
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          TICKET=$(printf '%s\n%s\n%s' "$BRANCH" "$TITLE" "$BODY" \
            | grep -oiP "${TICKET_PREFIX}-\d+" \
            | head -1 \
            | tr '[:lower:]' '[:upper:]')
          echo "id=$TICKET" >> "$GITHUB_OUTPUT"

      - name: Build Slack message
        id: msg
        env:
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          BODY=$(printf '%s' "$REVIEW_BODY" | head -c 300)

          if [ "$REVIEW_STATE" = "approved" ]; then
            echo "slack_msg=:white_check_mark: PR #${PR_NUM} approved by ${REVIEWER}" >> "$GITHUB_OUTPUT"
          elif [ "$REVIEW_STATE" = "changes_requested" ]; then
            echo "slack_msg=:x: PR #${PR_NUM} changes requested by ${REVIEWER}: ${BODY}" >> "$GITHUB_OUTPUT"
          else
            echo "slack_msg=:speech_balloon: PR #${PR_NUM} review by ${REVIEWER}: ${BODY}" >> "$GITHUB_OUTPUT"
          fi

          echo "linear_comment=Review (${REVIEW_STATE}) by ${REVIEWER}: ${BODY}" >> "$GITHUB_OUTPUT"

      - name: Look up Linear issue
        id: linear
        if: steps.ticket.outputs.id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET_ID: ${{ steps.ticket.outputs.id }}
        run: |
          TICKET_NUM="${TICKET_ID#*-}"
          RESPONSE=$(curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "query { issueSearch(filter: { number: { eq: $TICKET_NUM } }) { nodes { id } } }" '{query: $q}')")

          ISSUE_ID=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].id // empty')
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"

      - name: Add Linear comment
        if: steps.linear.outputs.issue_id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_ID: ${{ steps.linear.outputs.issue_id }}
          COMMENT_BODY: ${{ steps.msg.outputs.linear_comment }}
        run: |
          curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg id "$ISSUE_ID" \
              --arg body "$COMMENT_BODY" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')"

      - name: Notify Slack
        if: steps.msg.outputs.slack_msg != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MSG: ${{ steps.msg.outputs.slack_msg }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$SLACK_MSG" '{text: $text}')"
          fi

  ci-failure:
    if: >-
      github.event_name == 'check_suite' &&
      (github.event.check_suite.conclusion == 'failure' || github.event.check_suite.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CONCLUSION: ${{ github.event.check_suite.conclusion }}
          BRANCH: ${{ github.event.check_suite.head_branch }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            MSG=":x: CI failed on branch ${BRANCH} - ${CONCLUSION}"
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$MSG" '{text: $text}')"
          fi

  claude-review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'claude[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Extract ticket ID
        id: ticket
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          TICKET=$(printf '%s\n%s' "$TITLE" "$BODY" \
            | grep -oiP "${TICKET_PREFIX}-\d+" \
            | head -1 \
            | tr '[:lower:]' '[:upper:]')
          echo "id=$TICKET" >> "$GITHUB_OUTPUT"

      - name: Build message
        id: msg
        env:
          PR_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PREVIEW=$(printf '%s' "$COMMENT_BODY" | head -c 300)
          echo "slack_msg=:robot_face: Claude Code reviewed PR #${PR_NUM}: ${PREVIEW}" >> "$GITHUB_OUTPUT"
          echo "linear_comment=Claude Code review on PR #${PR_NUM}: ${PREVIEW}" >> "$GITHUB_OUTPUT"

      - name: Look up Linear issue
        id: linear
        if: steps.ticket.outputs.id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET_ID: ${{ steps.ticket.outputs.id }}
        run: |
          TICKET_NUM="${TICKET_ID#*-}"
          RESPONSE=$(curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "query { issueSearch(filter: { number: { eq: $TICKET_NUM } }) { nodes { id } } }" '{query: $q}')")

          ISSUE_ID=$(echo "$RESPONSE" | jq -r '.data.issueSearch.nodes[0].id // empty')
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"

      - name: Add Linear comment
        if: steps.linear.outputs.issue_id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUE_ID: ${{ steps.linear.outputs.issue_id }}
          COMMENT_BODY: ${{ steps.msg.outputs.linear_comment }}
        run: |
          curl -sf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg id "$ISSUE_ID" \
              --arg body "$COMMENT_BODY" \
              '{query: "mutation($id: String!, $body: String!) { commentCreate(input: { issueId: $id, body: $body }) { success } }", variables: {id: $id, body: $body}}')"

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MSG: ${{ steps.msg.outputs.slack_msg }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$SLACK_MSG" '{text: $text}')"
          fi
