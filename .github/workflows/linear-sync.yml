name: Linear Sync
on:
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Extract ticket ID from branch or title
        id: ticket
        run: |
          BRANCH="${{ github.head_ref }}"
          TITLE="${{ github.event.pull_request.title }}"
          TICKET=$(echo "$BRANCH $TITLE" | grep -oP '[A-Z]+-\d+' | head -1)
          echo "id=$TICKET" >> $GITHUB_OUTPUT
          echo "Found ticket: $TICKET"

      - name: Update Linear ticket status
        if: steps.ticket.outputs.id != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET_ID: ${{ steps.ticket.outputs.id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          # Determine target state based on PR action
          if [ "$PR_ACTION" = "opened" ] || [ "$PR_ACTION" = "ready_for_review" ] || [ "$PR_ACTION" = "reopened" ]; then
            STATE_NAME="In Review"
          elif [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
            STATE_NAME="Done"
          elif [ "$PR_ACTION" = "closed" ]; then
            STATE_NAME="In Progress"
          elif [ "$PR_ACTION" = "converted_to_draft" ]; then
            STATE_NAME="In Progress"
          else
            echo "No state change needed"
            exit 0
          fi

          # Get issue ID by identifier
          ISSUE_DATA=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { issueSearch(filter: { number: { eq: $(echo "$TICKET_ID" | grep -oP '\d+') } }) { nodes { id team { id } } } }\"}")

          ISSUE_ID=$(echo "$ISSUE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['issueSearch']['nodes'][0]['id'])" 2>/dev/null)
          TEAM_ID=$(echo "$ISSUE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['issueSearch']['nodes'][0]['team']['id'])" 2>/dev/null)

          if [ -z "$ISSUE_ID" ]; then
            echo "Could not find Linear issue for $TICKET_ID"
            exit 0
          fi

          # Get workflow state ID
          STATE_ID=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"query { workflowStates(filter: { team: { id: { eq: \\\"$TEAM_ID\\\" } }, name: { eq: \\\"$STATE_NAME\\\" } }) { nodes { id } } }\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['workflowStates']['nodes'][0]['id'])" 2>/dev/null)

          if [ -z "$STATE_ID" ]; then
            echo "Could not find state '$STATE_NAME'"
            exit 0
          fi

          # Update issue state
          curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { issueUpdate(id: \\\"$ISSUE_ID\\\", input: { stateId: \\\"$STATE_ID\\\" }) { success } }\"}"

          # Add comment linking PR
          curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"mutation { commentCreate(input: { issueId: \\\"$ISSUE_ID\\\", body: \\\"PR $PR_ACTION: [$PR_TITLE]($PR_URL)\\\" }) { success } }\"}"

          echo "Updated $TICKET_ID to '$STATE_NAME'"

      - name: Notify Slack
        if: steps.ticket.outputs.id != '' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ACTION="${{ github.event.action }}"
          MERGED="${{ github.event.pull_request.merged }}"
          TICKET="${{ steps.ticket.outputs.id }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          if [ "$ACTION" = "opened" ]; then
            MSG="PR opened by $AUTHOR for $TICKET: <$PR_URL|$PR_TITLE> - ticket moved to In Review"
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            MSG="PR merged for $TICKET: <$PR_URL|$PR_TITLE> - ticket marked Done"
          elif [ "$ACTION" = "closed" ]; then
            MSG="PR closed (not merged) for $TICKET: <$PR_URL|$PR_TITLE> - ticket back to In Progress"
          else
            MSG="PR $ACTION for $TICKET: <$PR_URL|$PR_TITLE>"
          fi

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"$MSG\"}"
