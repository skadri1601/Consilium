name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      agents: ${{ steps.filter.outputs.agents }}
      packages: ${{ steps.filter.outputs.packages }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'apps/api/**'
            agents:
              - 'apps/agents/**'
            packages:
              - 'packages/**'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: cd packages/database && pnpm db:generate

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm type-check

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.config == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: consilium_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:test_password@localhost:5432/consilium_test
      REDIS_URL: redis://localhost:6379
      CLERK_SECRET_KEY: test_key
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: cd packages/database && pnpm db:generate

      - run: cd packages/database && npx prisma migrate deploy

      - run: cd apps/api && pnpm test

      - name: E2E Tests
        continue-on-error: true
        run: cd apps/api && pnpm test:e2e

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.config == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: cd packages/database && pnpm db:generate

      - run: cd apps/web && pnpm test

      - run: cd apps/web && pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk

  test-agents:
    name: Test Agents
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/agents/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/agents/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - run: cd apps/agents && poetry install --no-interaction --no-root

      - run: cd apps/agents && poetry run pytest
        env:
          OPENAI_API_KEY: test-key-placeholder
          ANTHROPIC_API_KEY: test-key-placeholder
          GOOGLE_API_KEY: test-key-placeholder

  build:
    name: Build All
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-api, test-web, test-agents]
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: cd packages/database && pnpm db:generate

      - run: cd apps/api && pnpm build

      - run: cd apps/web && pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a

      - run: cd apps/agents && poetry install --no-interaction --no-root

      - run: cd apps/agents && poetry build

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, lint-and-typecheck, test-api, test-web, test-agents, build]
    if: always()
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
