name: Coverage

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-coverage:
    name: Web Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd packages/database && pnpm db:generate

      - name: Run tests with coverage
        run: cd apps/web && pnpm vitest run --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 5

  api-coverage:
    name: API Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: consilium_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd packages/database && pnpm db:generate

      - name: Run database migrations
        run: cd packages/database && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/consilium_test

      - name: Run tests with coverage
        run: cd apps/api && pnpm test -- --coverage --coverageReporters=json-summary
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/consilium_test
          REDIS_URL: redis://localhost:6379
          CLERK_SECRET_KEY: test_key
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NODE_ENV: test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 5

  agents-coverage:
    name: Agents Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: apps/agents/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/agents/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: cd apps/agents && poetry install --no-interaction --no-root

      - name: Run tests with coverage
        run: cd apps/agents && poetry run pytest --cov=src --cov-report=json --cov-report=term
        env:
          OPENAI_API_KEY: test-key-placeholder
          ANTHROPIC_API_KEY: test-key-placeholder
          GOOGLE_API_KEY: test-key-placeholder

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-coverage
          path: apps/agents/coverage.json
          retention-days: 5

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [web-coverage, api-coverage, agents-coverage]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts

      - name: Generate coverage summary
        id: coverage
        run: |
          echo "## Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "| Project | Statements | Branches | Functions | Lines |" >> coverage-report.md
          echo "|---------|-----------|----------|-----------|-------|" >> coverage-report.md

          if [ -f coverage-artifacts/web-coverage/coverage-summary.json ]; then
            WEB_STMTS=$(jq -r '.total.statements.pct // "N/A"' coverage-artifacts/web-coverage/coverage-summary.json)
            WEB_BRANCH=$(jq -r '.total.branches.pct // "N/A"' coverage-artifacts/web-coverage/coverage-summary.json)
            WEB_FUNCS=$(jq -r '.total.functions.pct // "N/A"' coverage-artifacts/web-coverage/coverage-summary.json)
            WEB_LINES=$(jq -r '.total.lines.pct // "N/A"' coverage-artifacts/web-coverage/coverage-summary.json)
            echo "| Web | ${WEB_STMTS}% | ${WEB_BRANCH}% | ${WEB_FUNCS}% | ${WEB_LINES}% |" >> coverage-report.md
          else
            echo "| Web | N/A | N/A | N/A | N/A |" >> coverage-report.md
          fi

          if [ -f coverage-artifacts/api-coverage/coverage-summary.json ]; then
            API_STMTS=$(jq -r '.total.statements.pct // "N/A"' coverage-artifacts/api-coverage/coverage-summary.json)
            API_BRANCH=$(jq -r '.total.branches.pct // "N/A"' coverage-artifacts/api-coverage/coverage-summary.json)
            API_FUNCS=$(jq -r '.total.functions.pct // "N/A"' coverage-artifacts/api-coverage/coverage-summary.json)
            API_LINES=$(jq -r '.total.lines.pct // "N/A"' coverage-artifacts/api-coverage/coverage-summary.json)
            echo "| API | ${API_STMTS}% | ${API_BRANCH}% | ${API_FUNCS}% | ${API_LINES}% |" >> coverage-report.md
          else
            echo "| API | N/A | N/A | N/A | N/A |" >> coverage-report.md
          fi

          if [ -f coverage-artifacts/agents-coverage/coverage.json ]; then
            AGENTS_PCT=$(jq -r '.totals.percent_covered | . * 100 | round / 100' coverage-artifacts/agents-coverage/coverage.json 2>/dev/null || echo "N/A")
            echo "| Agents | - | - | - | ${AGENTS_PCT}% |" >> coverage-report.md
          else
            echo "| Agents | N/A | N/A | N/A | N/A |" >> coverage-report.md
          fi

          echo "" >> coverage-report.md
          echo "*Generated from PR #${{ github.event.pull_request.number }}*" >> coverage-report.md

          BODY=$(cat coverage-report.md)
          echo "body<<COVERAGE_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "COVERAGE_EOF" >> "$GITHUB_OUTPUT"

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          message: ${{ steps.coverage.outputs.body }}
