name: Hadolint

on:
  push:
    branches: ["main"]
    paths:
      - "**/Dockerfile"
  pull_request:
    branches: ["main"]
    paths:
      - "**/Dockerfile"

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint on API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile
          format: sarif
          output-file: hadolint-api.sarif
          no-fail: true

      - name: Run hadolint on Web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          format: sarif
          output-file: hadolint-web.sarif
          no-fail: true

      - name: Run hadolint on Agents Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/agents/Dockerfile
          format: sarif
          output-file: hadolint-agents.sarif
          no-fail: true

      - name: Upload API results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-api.sarif
          category: hadolint-api

      - name: Upload Web results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-web.sarif
          category: hadolint-web

      - name: Upload Agents results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-agents.sarif
          category: hadolint-agents
