name: Bug Report
description: Report a bug in Consilium
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Consilium is affected?
      options:
        - Web App
        - API
        - Agents (Debate Engine)
        - CLI
        - SDK
        - Other
    validations:
      required: true
  - type: dropdown
    id: debate-mode
    attributes:
      label: Debate Mode
      description: Which debate mode were you using, if applicable?
      options:
        - N/A
        - council
        - devil
        - oracle
        - roundtable
        - red-team
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 22.04
    validations:
      required: false
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: e.g. 20.11.0
    validations:
      required: false
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: e.g. 3.12.1
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Add any relevant logs or screenshots.
    validations:
      required: false
